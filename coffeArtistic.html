<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenDentistry — Réplica editable</title>
<style>
  :root{
    --primary:#0077b6;
    --primary-dark:#023e8a;
    --accent:#00b4d8;
    --light:#caf0f8;
    --sky:#90e0ef;
    --bg:#f0faff;
    --text:#03045e;
    --white:#ffffff;
    --radius:16px;
    --shadow: 0 10px 30px rgba(2,62,138,.12);
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  section{padding:70px 6vw;}
  h1,h2,h3{color:var(--primary-dark); font-weight:800;}
  h2.section-title{
    font-size:clamp(1.8rem,3vw,2.6rem);
    text-align:center;
    margin-bottom:36px;
    position:relative;
  }
  h2.section-title::after{
    content:"";
    display:block;
    width:70px;
    height:4px;
    background:linear-gradient(90deg,var(--accent),var(--primary));
    margin:14px auto 0;
    border-radius:2px;
  }
  .btn{
    display:inline-block;
    padding:14px 30px;
    background:linear-gradient(90deg,var(--primary),var(--accent));
    color:#fff;
    border-radius:50px;
    font-weight:700;
    letter-spacing:.5px;
    box-shadow:var(--shadow);
    transition:transform .25s, box-shadow .25s;
    border:none;
    cursor:pointer;
  }
  .btn:hover{transform:translateY(-3px); box-shadow:0 14px 34px rgba(0,119,182,.25);}

  /* Header */
  header{
    position:sticky; top:0; z-index:100;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 6vw;
    box-shadow:0 2px 14px rgba(2,62,138,.08);
  }
  .logo{font-size:1.5rem; font-weight:900; color:var(--primary-dark);}
  .logo span{color:var(--accent);}
  nav ul{list-style:none; display:flex; gap:26px; align-items:center;}
  nav a{font-weight:600; color:var(--primary-dark); transition:color .2s;}
  nav a:hover{color:var(--accent);}
  .nav-cta{background:linear-gradient(90deg,var(--primary),var(--accent)); color:#fff!important; padding:10px 22px; border-radius:50px; font-weight:700;}
  .menu-toggle{display:none; font-size:1.6rem; background:none; border:none; color:var(--primary-dark); cursor:pointer;}

  /* Hero */
  .hero{
    background:linear-gradient(135deg,var(--primary-dark),var(--primary) 60%,var(--accent));
    color:#fff;
    display:flex; align-items:center; justify-content:space-between; gap:40px;
    min-height:80vh;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 80% 20%, rgba(255,255,255,.15), transparent 60%);
  }
  .hero-text{max-width:560px; z-index:2;}
  .hero-text .eyebrow{
    display:inline-block; background:rgba(255,255,255,.15); padding:6px 16px;
    border-radius:50px; font-size:.85rem; font-weight:700; letter-spacing:1px; margin-bottom:18px;
  }
  .hero-text h1{color:#fff; font-size:clamp(2rem,4.4vw,3.4rem); line-height:1.15; margin-bottom:20px;}
  .hero-regions{display:flex; flex-wrap:wrap; gap:10px; margin:24px 0;}
  .hero-regions span{
    background:rgba(255,255,255,.15);
    padding:8px 16px; border-radius:50px; font-size:.9rem; font-weight:600;
    border:1px solid rgba(255,255,255,.3);
  }
  .hero-img{max-width:380px; z-index:2;}
  .hero .btn{background:#fff; color:var(--primary-dark);}
  .hero .btn:hover{background:var(--light);}

  /* Welcome / stats */
  .welcome{background:var(--white);}
  .welcome-grid{display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:center;}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:30px;}
  .stat-card{
    background:linear-gradient(145deg,var(--light),var(--sky));
    border-radius:var(--radius); padding:22px 10px; text-align:center;
    box-shadow:var(--shadow);
  }
  .stat-card .value{font-size:1.8rem; font-weight:900; color:var(--primary-dark);}
  .stat-card .label{font-size:.85rem; font-weight:600; color:var(--primary);}

  /* Services */
  .services-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:22px;
  }
  .service-card{
    background:var(--white); border-radius:var(--radius); padding:28px 20px; text-align:center;
    box-shadow:var(--shadow); transition:transform .25s;
    border:2px solid transparent;
  }
  .service-card:hover{transform:translateY(-6px); border-color:var(--accent);}
  .service-card .icon{font-size:2.4rem; margin-bottom:10px;}
  .service-card h3{font-size:1.05rem; color:var(--primary-dark);}

  /* Gallery */
  .gallery{background:var(--white);}
  .gallery-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px;}
  .gallery-item{
    position:relative; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
    aspect-ratio:4/3;
  }
  .gallery-item img{width:100%; height:100%; object-fit:cover; transition:transform .4s;}
  .gallery-item:hover img{transform:scale(1.08);}
  .gallery-item .caption{
    position:absolute; bottom:0; left:0; right:0;
    background:linear-gradient(0deg, rgba(2,62,138,.85), transparent);
    color:#fff; padding:16px 12px 10px; font-size:.85rem; font-weight:600;
  }

  /* Reviews */
  .reviews-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:22px;}
  .review-card{
    background:var(--white); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);
    border-left:5px solid var(--accent);
  }
  .stars{color:#ffb703; margin-bottom:10px; font-size:.95rem;}
  .review-text{font-size:.92rem; margin-bottom:14px; color:#333;}
  .review-author{font-weight:700; color:var(--primary-dark);}
  .review-meta{font-size:.8rem; color:var(--primary); opacity:.8;}

  /* Locations */
  .locations{background:var(--white);}
  .region-filters{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:34px;}
  .region-filters button{
    padding:9px 20px; border-radius:50px; border:2px solid var(--sky); background:#fff;
    color:var(--primary-dark); font-weight:600; cursor:pointer; transition:.2s;
  }
  .region-filters button.active, .region-filters button:hover{
    background:linear-gradient(90deg,var(--primary),var(--accent)); color:#fff; border-color:transparent;
  }
  .locations-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px;}
  .location-card{
    background:var(--bg); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
  }
  .location-card img{height:150px; width:100%; object-fit:cover;}
  .location-body{padding:18px;}
  .location-body h3{font-size:1.05rem; margin-bottom:8px;}
  .location-body p{font-size:.85rem; margin:3px 0; color:#333;}
  .tag{
    display:inline-block; background:var(--sky); color:var(--primary-dark); font-size:.7rem;
    font-weight:700; padding:3px 10px; border-radius:50px; margin-bottom:8px;
  }

  /* Dentists */
  .dentists{background:linear-gradient(180deg,var(--bg),var(--light));}
  .dentists-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:24px;}
  .dentist-card{
    background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); text-align:center;
  }
  .dentist-card img{height:220px; width:100%; object-fit:cover;}
  .dentist-body{padding:18px;}
  .dentist-body h3{font-size:1rem; margin-bottom:8px;}
  .dentist-body p{font-size:.82rem; color:#333;}

  /* Patient safety */
  .safety-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:24px;}
  .safety-card{
    background:var(--white); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow);
    text-align:center;
  }
  .safety-card .icon{font-size:2.2rem; margin-bottom:10px;}

  /* Blogs */
  .blogs-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:22px;}
  .blog-card{background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .blog-card img{height:160px; width:100%; object-fit:cover;}
  .blog-card .blog-body{padding:18px;}
  .blog-card h3{font-size:1rem; margin-bottom:8px;}
  .blog-card p{font-size:.82rem; color:#333;}

  /* Quote */
  .quote{
    background:linear-gradient(120deg,var(--primary-dark),var(--primary));
    color:#fff; text-align:center; padding:80px 6vw;
  }
  .quote p{font-size:clamp(1.3rem,2.8vw,2rem); font-weight:700; max-width:800px; margin:0 auto;}

  /* FAQ */
  .faq-list{max-width:800px; margin:0 auto;}
  .faq-item{
    background:#fff; border-radius:12px; margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden;
  }
  .faq-question{
    padding:18px 22px; cursor:pointer; font-weight:700; color:var(--primary-dark);
    display:flex; justify-content:space-between; align-items:center;
  }
  .faq-answer{max-height:0; overflow:hidden; transition:max-height .3s ease; padding:0 22px;}
  .faq-item.open .faq-answer{max-height:300px; padding-bottom:18px;}
  .faq-question .arrow{transition:transform .3s;}
  .faq-item.open .arrow{transform:rotate(180deg);}

  /* CTA banner */
  .cta-banner{
    background:linear-gradient(120deg,var(--accent),var(--primary));
    color:#fff; text-align:center; border-radius:var(--radius); margin:0 6vw 70px;
    padding:60px 30px;
  }
  .cta-banner h2{color:#fff;}
  .cta-banner .btn{background:#fff; color:var(--primary-dark); margin-top:20px;}

  /* Smile visualization */
  .smile-viz{display:flex; gap:40px; align-items:center; flex-wrap:wrap; background:var(--white);}
  .smile-viz img{border-radius:var(--radius); box-shadow:var(--shadow); max-width:340px; flex:1;}
  .smile-viz-text{flex:2; min-width:280px;}

  /* Footer / contact */
  .contact{
    background:linear-gradient(120deg,var(--primary-dark),var(--primary));
    color:#fff; text-align:center;
  }
  .contact h2{color:#fff;}
  .contact .btn{background:#fff; color:var(--primary-dark); margin-top:20px;}
  footer{
    background:var(--text); color:#cfe8ff; padding:30px 6vw; text-align:center; font-size:.85rem;
  }
  footer .footer-links{display:flex; justify-content:center; gap:20px; margin-top:10px;}
  footer a:hover{color:var(--accent);}

  @media (max-width:900px){
    nav ul{
      position:fixed; top:70px; right:-100%; flex-direction:column; background:#fff;
      width:240px; height:calc(100vh - 70px); padding:30px 20px; box-shadow:-4px 0 20px rgba(0,0,0,.1);
      transition:right .3s;
    }
    nav ul.open{right:0;}
    .menu-toggle{display:block;}
    .hero{flex-direction:column; text-align:center; min-height:auto; padding:60px 6vw;}
    .hero-regions{justify-content:center;}
    .welcome-grid{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<header>
  <div class="logo" id="site-logo">Zen<span>Dentistry</span></div>
  <nav>
    <ul id="nav-links"></ul>
  </nav>
  <button class="menu-toggle" id="menu-toggle">☰</button>
</header>

<section class="hero" id="home">
  <div class="hero-text">
    <span class="eyebrow" id="hero-eyebrow"></span>
    <h1 id="hero-heading" style="color:#fff;"></h1>
    <div class="hero-regions" id="hero-regions"></div>
    <a class="btn" id="hero-cta" href="#contact"></a>
  </div>
  <img class="hero-img" id="hero-img" src="" alt="Zen Dentistry">
</section>

<section class="welcome" id="welcome">
  <div class="welcome-grid">
    <div>
      <h2 class="section-title" style="text-align:left;" id="welcome-heading"></h2>
      <p id="welcome-paragraph"></p>
      <a class="btn" id="welcome-cta" href="#contact" style="margin-top:24px; display:inline-block;"></a>
    </div>
    <div class="stats" id="stats-grid"></div>
  </div>
</section>

<section id="services">
  <h2 class="section-title" id="services-heading"></h2>
  <div class="services-grid" id="services-grid"></div>
</section>

<section class="gallery" id="gallery">
  <h2 class="section-title" id="gallery-heading"></h2>
  <p style="max-width:720px;margin:0 auto 30px;text-align:center;" id="gallery-paragraph"></p>
  <div class="gallery-grid" id="gallery-grid"></div>
  <div style="text-align:center;margin-top:34px;">
    <a class="btn" id="gallery-cta" href="#contact"></a>
  </div>
</section>

<section id="reviews">
  <h2 class="section-title" id="reviews-heading"></h2>
  <p style="max-width:720px;margin:0 auto 30px;text-align:center;" id="reviews-paragraph"></p>
  <div class="reviews-grid" id="reviews-grid"></div>
</section>

<section class="locations" id="locations">
  <h2 class="section-title" id="locations-heading"></h2>
  <div class="region-filters" id="region-filters"></div>
  <div class="locations-grid" id="locations-grid"></div>
  <div style="text-align:center;margin-top:34px;">
    <a class="btn" id="locations-cta" href="#contact"></a>
  </div>
</section>

<section class="dentists" id="dentists">
  <h2 class="section-title" id="dentists-heading"></h2>
  <p style="max-width:760px;margin:0 auto 30px;text-align:center;" id="dentists-paragraph"></p>
  <div class="dentists-grid" id="dentists-grid"></div>
  <div style="text-align:center;margin-top:34px;">
    <a class="btn" id="dentists-cta" href="#"></a>
  </div>
</section>

<section id="patient-safety">
  <h2 class="section-title" id="safety-heading"></h2>
  <p style="max-width:760px;margin:0 auto 30px;text-align:center;" id="safety-paragraph"></p>
  <div class="safety-grid" id="safety-grid"></div>
</section>

<section id="blogs">
  <h2 class="section-title" id="blogs-heading"></h2>
  <div class="blogs-grid" id="blogs-grid"></div>
  <div style="text-align:center;margin-top:34px;">
    <a class="btn" id="blogs-cta" href="#"></a>
  </div>
</section>

<div class="quote">
  <p id="quote-text"></p>
</div>

<section id="faq">
  <h2 class="section-title" id="faq-heading"></h2>
  <div class="faq-list" id="faq-list"></div>
</section>

<div class="cta-banner">
  <h2 id="ctabanner-heading"></h2>
  <p id="ctabanner-paragraph" style="max-width:700px;margin:14px auto 0;"></p>
  <a class="btn" id="ctabanner-cta" href="#contact"></a>
</div>

<section class="smile-viz" id="smile-visualization">
  <img id="smileviz-img" src="" alt="Smile Visualization">
  <div class="smile-viz-text">
    <h2 class="section-title" style="text-align:left;" id="smileviz-heading"></h2>
    <p id="smileviz-paragraph"></p>
  </div>
</section>

<section class="contact" id="contact">
  <h2 id="contact-heading"></h2>
  <a class="btn" id="contact-cta" href="#contact"></a>
</section>

<footer>
  <p id="footer-text"></p>
  <div class="footer-links" id="footer-links"></div>
</footer>

<script>
async function loadContent(){
  try{
    const res = await fetch('content.json');
    const data = await res.json();
    render(data);
  }catch(e){
    console.error('Error cargando content.json', e);
    document.body.insertAdjacentHTML('afterbegin',
      '<p style="background:#fee;color:#900;padding:14px;text-align:center;">No se pudo cargar content.json. Verifica que el archivo esté en la misma carpeta que index.html.</p>');
  }
}

function el(tag, opts={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(opts).forEach(([k,v])=>{
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k==='text') e.textContent = v;
    else e.setAttribute(k, v);
  });
  children.forEach(c => e.appendChild(c));
  return e;
}

function render(data){
  // Theme
  if(data.theme){
    const root = document.documentElement.style;
    root.setProperty('--primary', data.theme.colorPrimary);
    root.setProperty('--primary-dark', data.theme.colorPrimaryDark);
    root.setProperty('--accent', data.theme.colorAccent);
    root.setProperty('--light', data.theme.colorLight);
    root.setProperty('--sky', data.theme.colorSky);
    root.setProperty('--bg', data.theme.colorBg);
    root.setProperty('--text', data.theme.colorText);
  }

  // Site / favicon
  document.title = data.site?.name ? data.site.name + ' — Réplica editable' : document.title;

  // Nav
  const navUl = document.getElementById('nav-links');
  navUl.innerHTML = '';
  (data.nav?.links || []).forEach(link=>{
    navUl.appendChild(el('li',{}, [el('a',{href:link.url, text:link.label})]));
  });
  navUl.appendChild(el('li',{}, [el('a',{href:data.nav?.ctaUrl||'#', class:'nav-cta', text:data.nav?.cta||'Reserve'})]));

  document.getElementById('menu-toggle').addEventListener('click', ()=>{
    navUl.classList.toggle('open');
  });

  // Hero
  document.getElementById('hero-eyebrow').textContent = data.hero?.eyebrow || '';
  document.getElementById('hero-heading').textContent = data.hero?.heading || '';
  document.getElementById('hero-img').src = data.hero?.image || '';
  const heroRegions = document.getElementById('hero-regions');
  heroRegions.innerHTML='';
  (data.hero?.regions||[]).forEach(r=> heroRegions.appendChild(el('span',{text:r})));
  const heroCta = document.getElementById('hero-cta');
  heroCta.textContent = data.hero?.ctaLabel || '';
  heroCta.href = data.hero?.ctaUrl || '#contact';

  // Welcome
  document.getElementById('welcome-heading').textContent = data.welcome?.heading || '';
  document.getElementById('welcome-paragraph').textContent = data.welcome?.paragraph || '';
  const wcta = document.getElementById('welcome-cta');
  wcta.textContent = data.welcome?.cta || '';
  wcta.href = data.welcome?.ctaUrl || '#contact';
  const statsGrid = document.getElementById('stats-grid');
  statsGrid.innerHTML='';
  (data.welcome?.stats||[]).forEach(s=>{
    statsGrid.appendChild(el('div',{class:'stat-card'},[
      el('div',{class:'value', text:s.value + (s.suffix||'')}),
      el('div',{class:'label', text:s.label})
    ]));
  });

  // Services
  document.getElementById('services-heading').textContent = data.services?.heading || 'Services';
  const servicesGrid = document.getElementById('services-grid');
  servicesGrid.innerHTML='';
  (data.services?.items||[]).forEach(s=>{
    servicesGrid.appendChild(el('a',{class:'service-card', href:s.url||'#'},[
      el('div',{class:'icon', text:s.icon||'🦷'}),
      el('h3',{text:s.name})
    ]));
  });

  // Gallery
  document.getElementById('gallery-heading').textContent = data.gallery?.heading || '';
  document.getElementById('gallery-paragraph').textContent = data.gallery?.paragraph || '';
  const galleryGrid = document.getElementById('gallery-grid');
  galleryGrid.innerHTML='';
  (data.gallery?.items||[]).forEach(g=>{
    galleryGrid.appendChild(el('div',{class:'gallery-item'},[
      el('img',{src:g.image, alt:g.title}),
      el('div',{class:'caption', text:g.title})
    ]));
  });
  const gcta = document.getElementById('gallery-cta');
  gcta.textContent = data.gallery?.cta||'';
  gcta.href = data.gallery?.ctaUrl||'#contact';

  // Reviews
  document.getElementById('reviews-heading').textContent = data.reviews?.heading || '';
  document.getElementById('reviews-paragraph').textContent = data.reviews?.paragraph || '';
  const reviewsGrid = document.getElementById('reviews-grid');
  reviewsGrid.innerHTML='';
  (data.reviews?.items||[]).forEach(r=>{
    reviewsGrid.appendChild(el('div',{class:'review-card'},[
      el('div',{class:'stars', text:'★★★★★'}),
      el('p',{class:'review-text', text:r.text}),
      el('div',{class:'review-author', text:r.author + ' | ' + r.source}),
      el('div',{class:'review-meta', text:r.date})
    ]));
  });

  // Locations
  document.getElementById('locations-heading').textContent = data.locations?.heading || '';
  const regionFilters = document.getElementById('region-filters');
  const locationsGrid = document.getElementById('locations-grid');
  regionFilters.innerHTML='';
  const allItems = data.locations?.items || [];

  function renderLocations(filter){
    locationsGrid.innerHTML='';
    const filtered = (filter==='All Regions') ? allItems : allItems.filter(i=>i.region===filter);
    filtered.forEach(loc=>{
      locationsGrid.appendChild(el('div',{class:'location-card'},[
        el('img',{src:loc.image, alt:loc.name}),
        el('div',{class:'location-body'},[
          el('span',{class:'tag', text:loc.region}),
          el('h3',{text:loc.name}),
          el('p',{text:loc.address}),
          el('p',{html:'📞 ' + loc.phone}),
          el('p',{html:'✉️ ' + loc.email})
        ])
      ]));
    });
  }

  (data.locations?.regions||[]).forEach((r,idx)=>{
    const btn = el('button',{text:r});
    if(idx===0) btn.classList.add('active');
    btn.addEventListener('click', ()=>{
      regionFilters.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderLocations(r);
    });
    regionFilters.appendChild(btn);
  });
  renderLocations('All Regions');

  const lcta = document.getElementById('locations-cta');
  lcta.textContent = data.locations?.cta||'';
  lcta.href = data.locations?.ctaUrl||'#contact';

  // Dentists
  document.getElementById('dentists-heading').textContent = data.dentists?.heading || '';
  document.getElementById('dentists-paragraph').textContent = data.dentists?.paragraph || '';
  const dentistsGrid = document.getElementById('dentists-grid');
  dentistsGrid.innerHTML='';
  (data.dentists?.items||[]).forEach(d=>{
    dentistsGrid.appendChild(el('div',{class:'dentist-card'},[
      el('img',{src:d.image, alt:d.name}),
      el('div',{class:'dentist-body'},[
        el('h3',{text:d.name}),
        el('p',{text:d.bio})
      ])
    ]));
  });
  const dcta = document.getElementById('dentists-cta');
  dcta.textContent = data.dentists?.cta||'';
  dcta.href = data.dentists?.ctaUrl||'#';

  // Patient safety
  document.getElementById('safety-heading').textContent = data.patientSafety?.heading || '';
  document.getElementById('safety-paragraph').textContent = data.patientSafety?.paragraph || '';
  const safetyGrid = document.getElementById('safety-grid');
  safetyGrid.innerHTML='';
  (data.patientSafety?.items||[]).forEach(s=>{
    safetyGrid.appendChild(el('div',{class:'safety-card'},[
      el('div',{class:'icon', text:s.icon||'🦷'}),
      el('h3',{text:s.title}),
      el('p',{text:s.text})
    ]));
  });

  // Blogs
  document.getElementById('blogs-heading').textContent = data.blogs?.heading || '';
  const blogsGrid = document.getElementById('blogs-grid');
  blogsGrid.innerHTML='';
  (data.blogs?.items||[]).forEach(b=>{
    blogsGrid.appendChild(el('a',{class:'blog-card', href:b.url||'#'},[
      el('img',{src:b.image, alt:b.title}),
      el('div',{class:'blog-body'},[
        el('h3',{text:b.title}),
        el('p',{text:b.excerpt})
      ])
    ]));
  });
  const bcta = document.getElementById('blogs-cta');
  bcta.textContent = data.blogs?.cta||'';
  bcta.href = data.blogs?.ctaUrl||'#';

  // Quote
  document.getElementById('quote-text').textContent = data.quote?.text || '';

  // FAQ
  document.getElementById('faq-heading').textContent = data.faq?.heading || '';
  const faqList = document.getElementById('faq-list');
  faqList.innerHTML='';
  (data.faq?.items||[]).forEach(f=>{
    const item = el('div',{class:'faq-item'},[
      el('div',{class:'faq-question'},[
        el('span',{text:f.q}),
        el('span',{class:'arrow', text:'⌄'})
      ]),
      el('div',{class:'faq-answer'},[el('p',{text:f.a})])
    ]);
    item.querySelector('.faq-question').addEventListener('click', ()=>{
      item.classList.toggle('open');
    });
    faqList.appendChild(item);
  });

  // CTA banner
  document.getElementById('ctabanner-heading').textContent = data.ctaBanner?.heading || '';
  document.getElementById('ctabanner-paragraph').textContent = data.ctaBanner?.paragraph || '';
  const cbcta = document.getElementById('ctabanner-cta');
  cbcta.textContent = data.ctaBanner?.cta||'';
  cbcta.href = data.ctaBanner?.ctaUrl||'#contact';

  // Smile visualization
  document.getElementById('smileviz-heading').textContent = data.smileVisualization?.heading || '';
  document.getElementById('smileviz-paragraph').textContent = data.smileVisualization?.paragraph || '';
  document.getElementById('smileviz-img').src = data.smileVisualization?.image || '';

  // Contact
  document.getElementById('contact-heading').textContent = data.contact?.heading || '';
  const ccta = document.getElementById('contact-cta');
  ccta.textContent = data.contact?.cta||'';
  ccta.href = data.contact?.ctaUrl||'#contact';

  // Footer
  document.getElementById('footer-text').textContent = data.footer?.text || '';
  const footerLinks = document.getElementById('footer-links');
  footerLinks.innerHTML='';
  (data.footer?.links||[]).forEach(l=>{
    footerLinks.appendChild(el('a',{href:l.url, text:l.label}));
  });
}

loadContent();
</script>
</body>
</html>
